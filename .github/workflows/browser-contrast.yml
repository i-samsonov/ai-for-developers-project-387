name: Browser contrast evidence

on:
  pull_request:
    paths:
      - src/**
      - index.html
      - vite.config.*
      - scripts/browser-contrast.mjs
      - .github/workflows/browser-contrast.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out head
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_SHA"
      - name: Checkout trusted base verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .browser-verifier
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local application with API
        run: |
          DATABASE_PATH="$RUNNER_TEMP/browser-calendar.sqlite" npm run start:api > "$RUNNER_TEMP/calendar-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/calendar-api.log"
          exit 1
      - name: Verify computed contrast and booking in Chromium
        run: |
          if [ -f .browser-verifier/scripts/browser-contrast.mjs ]; then
            node .browser-verifier/scripts/browser-contrast.mjs
          else
            echo "::warning::Bootstrap PR: verifier does not exist on base yet; running the proposed verifier from this PR"
            node scripts/browser-contrast.mjs
          fi
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save browser evidence for this head SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 30
