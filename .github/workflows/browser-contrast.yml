name: Browser contrast evidence

on:
  pull_request:
    paths:
      - src/App.tsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local application with API
        run: |
          DATABASE_PATH="$RUNNER_TEMP/browser-calendar.sqlite" npm run start:api > "$RUNNER_TEMP/calendar-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/calendar-api.log"
          exit 1
      - name: Verify computed contrast and booking in Chromium
        run: node scripts/browser-contrast.mjs
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save browser evidence for this head SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 30
